<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Facturación - JD Reparaciones PC</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> <style> body{ font-family:Arial,sans-serif; background:#0f172a; color:white; max-width:800px; margin:auto; padding:20px; } .caja{ background:#111827; padding:25px; border-radius:16px; border:1px solid rgba(255,255,255,.08); } h1{ text-align:center; color:#60a5fa; margin-bottom:20px; } .grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; } input, textarea{ width:100%; padding:12px; border-radius:10px; border:none; margin-top:5px; } textarea{ min-height:90px; resize:vertical; } .fila{ margin-bottom:15px; } button{ width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; cursor:pointer; margin-top:10px; font-weight:bold; } .pdf{ background:#2563eb; color:white; } .pdf:hover{ background:#1d4ed8; } .wa{ background:#25d366; color:white; } .wa:hover{ background:#1fb85a; } .total{ background:#0b1220; padding:15px; border-radius:10px; margin-top:15px; } @media (max-width:700px){ .grid{ grid-template-columns:1fr; } } </style> </head> <body> <div class="caja"> <h1>📄 JD Reparaciones PC</h1> <div class="grid"> <div class="fila"> <label>Cliente</label> <input type="text" id="cliente" placeholder="Nombre del cliente"> </div> <div class="fila"> <label>Teléfono</label> <input type="text" id="telefono" placeholder="600123456"> </div> </div> <div class="fila"> <label>Correo electrónico</label> <input type="email" id="email" placeholder="cliente@email.com"> </div> <div class="fila"> <label>Servicio realizado</label> <textarea id="servicio" placeholder="Ejemplo: Formateo + instalación de Windows 11 + drivers + Office"></textarea> </div> <div class="grid"> <div class="fila"> <label>Importe base (€)</label> <input type="number" id="importe" value="35" step="0.01" oninput="calcular()"> </div> <div class="fila"> <label>IVA (%)</label> <input type="number" id="iva" value="21" step="1" oninput="calcular()"> </div> </div> <div class="total"> <p>Base: <strong id="baseTxt">35.00 €</strong></p> <p>IVA: <strong id="ivaTxt">7.35 €</strong></p> <p style="font-size:1.2rem">TOTAL: <strong id="totalTxt">42.35 €</strong></p> </div> <button class="pdf" onclick="generarFactura()"> 📥 Generar factura PDF </button> <button class="wa" onclick="enviarWhatsApp()"> 💬 Enviar resumen por WhatsApp </button> </div> <script> function calcular(){ const base = parseFloat(document.getElementById('importe').value || 0); const ivaPorc = parseFloat(document.getElementById('iva').value || 0); const iva = base * ivaPorc / 100; const total = base + iva; document.getElementById('baseTxt').innerText = base.toFixed(2) + ' €'; document.getElementById('ivaTxt').innerText = iva.toFixed(2) + ' €'; document.getElementById('totalTxt').innerText = total.toFixed(2) + ' €'; } function siguienteNumero(){ let n = parseInt(localStorage.getItem('contadorFacturas') || '0'); n++; localStorage.setItem('contadorFacturas', n); return 'FAC-' + String(n).padStart(4,'0'); } async function generarFactura(){ const { jsPDF } = window.jspdf; const doc = new jsPDF(); const numero = siguienteNumero(); const fecha = new Date().toLocaleDateString('es-ES'); const cliente = document.getElementById('cliente').value; const telefono = document.getElementById('telefono').value; const email = document.getElementById('email').value; const servicio = document.getElementById('servicio').value; const base = parseFloat(document.getElementById('importe').value || 0); const ivaPorc = parseFloat(document.getElementById('iva').value || 0); const iva = base * ivaPorc / 100; const total = base + iva; // Guardar cliente const clientes = JSON.parse(localStorage.getItem('clientesJD') || '[]'); clientes.push({ cliente, telefono, email, fecha }); localStorage.setItem('clientesJD', JSON.stringify(clientes)); // PDF doc.setFontSize(22); doc.text('JD Reparaciones PC', 20, 20); doc.setFontSize(11); doc.text('Jesús Doñate', 20, 30); doc.text('Castellón - España', 20, 36); doc.text('Tel: 600 000 000', 20, 42); doc.setFontSize(14); doc.text('FACTURA', 150, 20); doc.setFontSize(11); doc.text('Nº: ' + numero, 150, 30); doc.text('Fecha: ' + fecha, 150, 36); doc.line(20, 50, 190, 50); doc.setFontSize(13); doc.text('Datos del cliente', 20, 62); doc.setFontSize(11); doc.text('Nombre: ' + cliente, 20, 72); doc.text('Teléfono: ' + telefono, 20, 80); doc.text('Email: ' + email, 20, 88); doc.line(20, 98, 190, 98); doc.setFontSize(13); doc.text('Servicio realizado', 20, 110); doc.setFontSize(11); doc.text(doc.splitTextToSize(servicio, 170), 20, 120); doc.line(20, 165, 190, 165); doc.text('Base imponible', 20, 178); doc.text(base.toFixed(2) + ' €', 160, 178); doc.text('IVA (' + ivaPorc + '%)', 20, 188); doc.text(iva.toFixed(2) + ' €', 160, 188); doc.setFontSize(14); doc.text('TOTAL', 20, 202); doc.text(total.toFixed(2) + ' €', 160, 202); doc.setFontSize(10); doc.text('Gracias por confiar en JD Reparaciones PC', 20, 280); doc.save(numero + '.pdf'); } function enviarWhatsApp(){ const cliente = document.getElementById('cliente').value; const servicio = document.getElementById('servicio').value; const total = document.getElementById('totalTxt').innerText; const mensaje = 'Hola ' + cliente + ', tu reparación está lista.%0A%0A' + 'Servicio: ' + servicio + '%0A' + 'Total: ' + total + '%0A%0A' + 'JD Reparaciones PC'; window.open( 'https://wa.me/34623146807?text=' + mensaje, '_blank' ); } calcular(); </script> </body> </html>
